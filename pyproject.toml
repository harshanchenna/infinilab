[project]
name = "infinilab"
version = "0.1.0"
description = "An autoresearch-style forever-loop for the Riemann Hypothesis."
requires-python = ">=3.10"
dependencies = [
    "mpmath>=1.3.0",
    "numpy>=1.26",
    "sympy>=1.12",
]

# Optional, faster arbitrary-precision backend. Not required: the harness
# falls back to mpmath everywhere. Install with `pip install python-flint`.
[project.optional-dependencies]
fast = ["python-flint>=0.6.0"]

[tool.infinilab]
# Wall-clock budget for a single experiment's run() (Tier-1 verifier timeout).
# This is the analog of Karpathy autoresearch's fixed 5-minute training budget.
experiment_budget_seconds = 300
